<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title description">
  <title id="title">CUDA Graph versus eager p99 total update latency by capacity</title>
  <desc id="description">Grouped bars compare measured p99 total update latency at one, ten, and twenty million packed particles. Graph values are 0.636, 3.639, and 7.487 milliseconds. Eager values are 0.894, 3.628, and 6.995 milliseconds.</desc>
  <style>
    .bg{fill:#101827}.grid{stroke:#40516a;stroke-width:1}.axis{stroke:#aebbd0;stroke-width:1.4}.t{fill:#e8eef8;font:14px Arial,sans-serif}.s{fill:#aebbd0;font:12px Arial,sans-serif}.v{fill:#e8eef8;font:12px Arial,sans-serif;font-weight:bold}.g{fill:#35b9a0}.e{fill:#7e94b8}
  </style>
  <rect class="bg" width="760" height="390" rx="12"/>
  <text class="t" x="48" y="37" font-weight="bold">p99 total update latency by capacity</text>
  <text class="s" x="48" y="59">RTX 3050 Laptop GPU · packed ramp · 120 frames · lower is better · milliseconds</text>
  <line class="grid" x1="90" y1="100" x2="720" y2="100"/><line class="grid" x1="90" y1="165" x2="720" y2="165"/><line class="grid" x1="90" y1="230" x2="720" y2="230"/><line class="grid" x1="90" y1="295" x2="720" y2="295"/>
  <line class="axis" x1="90" y1="295" x2="720" y2="295"/><line class="axis" x1="90" y1="92" x2="90" y2="295"/>
  <text class="s" x="55" y="299">0</text><text class="s" x="55" y="234">3</text><text class="s" x="55" y="169">6</text><text class="s" x="55" y="104">9</text>
  <rect class="g" x="170" y="281.0" width="56" height="14.0" rx="3"/><rect class="e" x="236" y="275.4" width="56" height="19.6" rx="3"/>
  <rect class="g" x="372" y="215.9" width="56" height="79.1" rx="3"/><rect class="e" x="438" y="216.2" width="56" height="78.8" rx="3"/>
  <rect class="g" x="574" y="132.6" width="56" height="162.4" rx="3"/><rect class="e" x="640" y="143.4" width="56" height="151.6" rx="3"/>
  <text class="v" x="181" y="274">0.636</text><text class="v" x="247" y="268">0.894</text>
  <text class="v" x="383" y="209">3.639</text><text class="v" x="449" y="209">3.628</text>
  <text class="v" x="585" y="126">7.487</text><text class="v" x="651" y="137">6.995</text>
  <text class="t" x="211" y="326" text-anchor="middle">1M</text><text class="t" x="413" y="326" text-anchor="middle">10M</text><text class="t" x="615" y="326" text-anchor="middle">20M</text>
  <rect class="g" x="90" y="351" width="12" height="12" rx="2"/><text class="s" x="109" y="362">CUDA Graph</text><rect class="e" x="218" y="351" width="12" height="12" rx="2"/><text class="s" x="237" y="362">Eager</text>
</svg>
